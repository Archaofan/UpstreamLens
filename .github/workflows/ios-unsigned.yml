name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Static checks (braces and localization keys)
        run: |
          set -euo pipefail
          python3 scripts/check_braces.py
          python3 scripts/check_l10n_keys.py
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"]))')"
          xcodebuild test -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
      - name: Capture home screen in light and dark mode
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"]))')"
          xcodebuild build -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Debug -derivedDataPath build/ui-derived -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/ui-derived/Build/Products/Debug-iphonesimulator/UpstreamLens.app
          mkdir -p build/screenshots
          # 启动崩溃闸：单元测试跑的是逻辑，不覆盖 App 真实启动路径
          # （AppModel.init 会读盘、跑一次性迁移并落盘）。启动即崩溃以前会被静默漏掉，
          # 截图只会拍到桌面。
          #
          # 只统计**主 App** 的崩溃报告：模拟器里 Widget 扩展会因 XPC 连接报
          # ExcUserFault_UpstreamLensWidget（is_simulated:1, bundleID ...ios.widget），
          # 那是模拟器环境的固有现象，与主 App 启动无关，不能拿来当门禁——
          # 否则门禁会误报（首轮实测正是被它挡下的）。它仍然打印出来以保留可见性。
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          # 注意：函数末尾显式 return 0。`set -o pipefail` 下 grep 无匹配会让整条
          # 管道返回非零，命令替换在 `set -e` 下会直接终止脚本——门禁自身不能崩。
          crash_listing() { ls "$CRASH_DIR" 2>/dev/null || true; }
          app_crashes() {
            crash_listing | grep -i upstreamlens | grep -vi widget | wc -l | tr -d ' \n'
            return 0
          }
          widget_faults() {
            crash_listing | grep -i upstreamlenswidget | wc -l | tr -d ' \n'
            return 0
          }
          BEFORE="$(app_crashes)"
          check_launch() {
            local label="$1"
            xcrun simctl launch "$SIMULATOR_ID" com.upstreamlens.ios
            sleep 4
            local now
            now="$(app_crashes)"
            if [ "$now" -gt "$BEFORE" ]; then
              echo "::error::UpstreamLens (main app) crashed on launch ($label)"
              ls -la "$CRASH_DIR" | grep -i upstreamlens || true
              for f in "$CRASH_DIR"/*UpstreamLens-*; do
                if [ -f "$f" ]; then sed -n '1,80p' "$f" || true; fi
              done
              exit 1
            fi
            local faults
            faults="$(widget_faults)"
            if [ "$faults" -gt 0 ]; then
              echo "note: $faults simulator-only widget extension fault report(s) present (not gating) ($label)"
            fi
            if xcrun simctl spawn "$SIMULATOR_ID" launchctl list 2>/dev/null | grep -qi upstreamlens; then
              echo "process alive ($label)"
            else
              echo "note: process not listed by launchctl ($label)"
            fi
          }
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          check_launch light
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/home-light.png
          xcrun simctl terminate "$SIMULATOR_ID" com.upstreamlens.ios || true
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          check_launch dark
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/home-dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: UpstreamLens-ui-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error
      - name: Archive unsigned app and widget
        run: |
          xcodebuild archive -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Release -destination 'generic/platform=iOS' -archivePath build/UpstreamLens.xcarchive CURRENT_PROJECT_VERSION="${{ github.run_number }}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Embed entitlements with adhoc codesign
        run: |
          set -euo pipefail
          APP='build/UpstreamLens.xcarchive/Products/Applications/UpstreamLens.app'
          WIDGET="$APP/PlugIns/UpstreamLensWidget.appex"
          # Codesigning was disabled during archiving, so the binaries carry no
          # entitlements; the re-signing tools on the device read entitlements from
          # the Mach-O. Adhoc-sign with entitlements so SideStore registers the
          # App Group during re-sign. (ldid's brew bottle proved unreliable here.)
          codesign --force --sign - --entitlements "$PWD/Sources/App/UpstreamLens.entitlements" "$APP/UpstreamLens"
          codesign --force --sign - --entitlements "$PWD/Sources/Widget/UpstreamLensWidget.entitlements" "$WIDGET/UpstreamLensWidget"
      - name: Verify archive and package IPA
        run: |
          set -euo pipefail
          APP='build/UpstreamLens.xcarchive/Products/Applications/UpstreamLens.app'
          WIDGET="$APP/PlugIns/UpstreamLensWidget.appex"
          test -d "$APP"
          test -d "$WIDGET"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = 'com.upstreamlens.ios'
          test "$(plutil -extract CFBundleIdentifier raw "$WIDGET/Info.plist")" = 'com.upstreamlens.ios.widget'
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WIDGET/Info.plist")" = 'com.apple.widgetkit-extension'
          test "$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")" = '17.0'
          lipo "$APP/UpstreamLens" -verify_arch arm64
          lipo "$WIDGET/UpstreamLensWidget" -verify_arch arm64
          test ! -e "$APP/embedded.mobileprovision"
          test ! -e "$WIDGET/embedded.mobileprovision"
          for BIN in "$APP/UpstreamLens" "$WIDGET/UpstreamLensWidget"; do
            # 只校验代码签名本身：二进制是裸签（无 bundle 资源密封），设备侧重签工具会重建整包签名。
            codesign --verify --ignore-resources "$BIN"
            test "$(codesign -dv "$BIN" 2>&1 | grep -c 'Signature=adhoc')" = '1'
          done
          codesign -d --entitlements - "$APP/UpstreamLens" 2>/dev/null | grep -q 'group.com.upstreamlens.ios'
          codesign -d --entitlements - "$WIDGET/UpstreamLensWidget" 2>/dev/null | grep -q 'group.com.upstreamlens.ios'
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/UpstreamLens.app
          (cd build/package && zip -qry ../UpstreamLens-unsigned.ipa Payload)
          unzip -t build/UpstreamLens-unsigned.ipa
          shasum -a 256 build/UpstreamLens-unsigned.ipa | tee build/UpstreamLens-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: UpstreamLens-unsigned
          path: |
            build/UpstreamLens-unsigned.ipa
            build/UpstreamLens-unsigned.sha256
          if-no-files-found: error
