name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen and generate project
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate
      - name: Unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"]))')"
          xcodebuild test -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
      - name: Capture home screen in light and dark mode
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if "iPhone" in x["name"]))')"
          xcodebuild build -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Debug -derivedDataPath build/ui-derived -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/ui-derived/Build/Products/Debug-iphonesimulator/UpstreamLens.app
          mkdir -p build/screenshots
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl launch "$SIMULATOR_ID" com.upstreamlens.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/home-light.png
          xcrun simctl terminate "$SIMULATOR_ID" com.upstreamlens.ios
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          xcrun simctl launch "$SIMULATOR_ID" com.upstreamlens.ios
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/home-dark.png
      - uses: actions/upload-artifact@v4
        with:
          name: UpstreamLens-ui-screenshots
          path: build/screenshots/*.png
          if-no-files-found: error
      - name: Archive unsigned app and widget
        run: |
          xcodebuild archive -project UpstreamLens.xcodeproj -scheme UpstreamLens -configuration Release -destination 'generic/platform=iOS' -archivePath build/UpstreamLens.xcarchive CURRENT_PROJECT_VERSION="${{ github.run_number }}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Embed entitlements with ldid
        run: |
          set -euo pipefail
          brew install ldid
          APP='build/UpstreamLens.xcarchive/Products/Applications/UpstreamLens.app'
          WIDGET="$APP/PlugIns/UpstreamLensWidget.appex"
          # Codesigning was disabled, so the archive carries no entitlements in the
          # binaries; the re-signing tools on the device read entitlements from the
          # Mach-O. Embed them (adhoc) so SideStore registers the App Group.
          ldid -S"$PWD/Sources/App/UpstreamLens.entitlements" "$APP/UpstreamLens"
          ldid -S"$PWD/Sources/Widget/UpstreamLensWidget.entitlements" "$WIDGET/UpstreamLensWidget"
      - name: Verify archive and package IPA
        run: |
          set -euo pipefail
          APP='build/UpstreamLens.xcarchive/Products/Applications/UpstreamLens.app'
          WIDGET="$APP/PlugIns/UpstreamLensWidget.appex"
          test -d "$APP"
          test -d "$WIDGET"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")" = 'com.upstreamlens.ios'
          test "$(plutil -extract CFBundleIdentifier raw "$WIDGET/Info.plist")" = 'com.upstreamlens.ios.widget'
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$WIDGET/Info.plist")" = 'com.apple.widgetkit-extension'
          test "$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")" = '17.0'
          lipo "$APP/UpstreamLens" -verify_arch arm64
          lipo "$WIDGET/UpstreamLensWidget" -verify_arch arm64
          test ! -e "$APP/embedded.mobileprovision"
          test ! -e "$WIDGET/embedded.mobileprovision"
          for BIN in "$APP/UpstreamLens" "$WIDGET/UpstreamLensWidget"; do
            codesign --verify "$BIN"
            test "$(codesign -dv "$BIN" 2>&1 | grep -c 'Signature=adhoc')" = '1'
          done
          codesign -d --entitlements - "$APP/UpstreamLens" 2>/dev/null | grep -q 'group.com.upstreamlens.ios'
          codesign -d --entitlements - "$WIDGET/UpstreamLensWidget" 2>/dev/null | grep -q 'group.com.upstreamlens.ios'
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/UpstreamLens.app
          (cd build/package && zip -qry ../UpstreamLens-unsigned.ipa Payload)
          unzip -t build/UpstreamLens-unsigned.ipa
          shasum -a 256 build/UpstreamLens-unsigned.ipa | tee build/UpstreamLens-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: UpstreamLens-unsigned
          path: |
            build/UpstreamLens-unsigned.ipa
            build/UpstreamLens-unsigned.sha256
          if-no-files-found: error
